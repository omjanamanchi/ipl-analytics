# Local PostgreSQL 16 (same major version as Cloud SQL). Start with: docker compose up -d
# Host port 5433 (not 5432) so it never clashes with another local Postgres.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ipl
      POSTGRES_PASSWORD: ipl_local_dev   # local only; never reuse in the cloud
      POSTGRES_DB: ipl
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
